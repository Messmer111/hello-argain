<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Hello ARgain</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- A-Frame + AR.js -->
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.5/aframe/build/aframe-ar.js"></script>

    <!-- Bootstrap (optional, for UI) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />

    <!-- Your CSS -->
    <link rel="stylesheet" href="assets/css/app.css" />
  </head>

  <body style="margin: 0; overflow: hidden;">
    <div class="container text-center mt-3">
      <h1 class="display-4">Hello ARgain</h1>
      <p class="lead">Point your camera at your custom marker</p>
    </div>

    <a-scene embedded arjs>
      <a-marker type="pattern" url="assets/pattern-marker/pattern-lambo.patt">
        <a-box position="0 0 0" scale="0.5 0.5 0.5" material="color: red;"></a-box>
      </a-marker>
      <a-entity camera></a-entity>
    </a-scene>

    <script src="assets/js/app.js"></script>
  </body>
</html>
